
server:
  port: 8080

spring:
  application:
    name: rag-chat-history-service

  datasource:
    url: jdbc:mysql://localhost:3306/chatdb
    username: root
    password: Forgot1810
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect



  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: INFO

security:
  api-key: my-secret-api-key

rate-limit:
  capacity: 100
  refill-tokens: 100
  refill-duration-minutes: 1


